<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYVORA | Checkout</title>
<link rel="stylesheet" href="style.css">

<style>
.checkout-container{
    max-width:1200px;
    margin:60px auto;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 400px;
    gap:40px;
}

.checkout-form,
.order-summary{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.checkout-form h2,
.order-summary h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:16px;
    font-size:1rem;
}

.form-group textarea{
    resize:none;
    height:120px;
}

.place-order-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:20px;
    background:#0f172a;
    color:white;
    font-size:1rem;
    cursor:pointer;
}

.place-order-btn:hover{
    opacity:0.9;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.summary-total{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #ddd;
    font-size:1.2rem;
    font-weight:bold;
}


.payment-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}

.payment-option:hover{
    border-color:#2563eb;
    background:#f8fafc;
}

.payment-option input{
    width:auto;
    margin:0;
}

.payment-option label{
    margin:0;
    font-weight:500;
    cursor:pointer;
}

.place-order-btn{
    margin-top:15px;
}


@media(max-width:900px){
    .checkout-container{
        grid-template-columns:1fr;
    }
}

.payment-option{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.payment-option input{
    width:auto;
    margin:0;
}
</style>

</head>
<body>

<header>
    <div class="topbar">
        Secure Checkout • Fast Delivery • Trusted Support
    </div>
</header>

<div class="checkout-container">

    <div class="checkout-form">
        <h2>Customer Information</h2>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="+234...">
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <textarea placeholder="Enter delivery address"></textarea>
        </div>

        <div class="form-group">

    <label>Payment Method</label>

    <div class="payment-option">
    <input type="radio" name="payment" checked>
    <label>Cash on Delivery</label>
</div>

<div class="payment-option">
    <input type="radio" name="payment">
    <label>Bank Transfer</label>
</div>

<div class="payment-option">
    <input type="radio" name="payment">
    <label>Debit / Credit Card</label>
</div>

</div>

        <button
    class="place-order-btn"
    id="place-order-btn">
    Place Order
</button>
    </div>

    <div class="order-summary">

        <h2>Order Summary</h2>

        <div id="checkout-items"></div>

        <div class="summary-total">

    <div class="summary-item">
        <span>Shipping</span>
        <span>$10</span>
    </div>

    <hr>

    Total: $<span id="checkout-total">0</span>

</div>

    </div>

</div>

<script>

const cart = JSON.parse(localStorage.getItem("cart")) || [];

if(cart.length === 0){

    alert(
        "Your cart is empty."
    );

    window.location.href =
    "shop.html";

}

const checkoutItems =
document.getElementById("checkout-items");

const checkoutTotal =
document.getElementById("checkout-total");

let total = 0;
const shippingFee = 10;

cart.forEach(item => {

    total += item.price * item.quantity;

    checkoutItems.innerHTML += `
        <div class="summary-item">
            <span>
                ${item.name}
                (x${item.quantity})
            </span>
            <span>
                $${item.price * item.quantity}
            </span>
        </div>
    `;
});

checkoutTotal.textContent = total + shippingFee;

document
.getElementById("place-order-btn")
.addEventListener("click", () => {

    const name =
    document.querySelector(
        'input[type="text"]'
    ).value.trim();

    const email =
    document.querySelector(
        'input[type="email"]'
    ).value.trim();

    const phone =
    document.querySelector(
        'input[type="tel"]'
    ).value.trim();

    const address =
    document.querySelector(
        'textarea'
    ).value.trim();

    if(
        !name ||
        !email ||
        !phone ||
        !address
    ){
        alert(
            "Please complete all fields."
        );
        return;
    }

    localStorage.setItem(
    "customerName",
    name
);

localStorage.removeItem("cart");

window.location.href =
"success.html";

});
</script>

</body>
</html>
