<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYVORA | Order Successful</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.success-card{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    max-width:500px;
}

.success-icon{
    font-size:70px;
}

h1{
    margin:20px 0;
}

.order-id{
    background:#f1f5f9;
    padding:12px;
    border-radius:10px;
    margin:20px 0;
    font-weight:bold;
}

.shop-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 24px;
    border-radius:12px;
    background:#0f172a;
    color:white;
    text-decoration:none;
}

.order-details{
    text-align:left;
    margin-top:25px;
    padding:20px;
    background:#f8fafc;
    border-radius:12px;
}

.order-details p{
    margin:10px 0;
    line-height:1.5;
}

.order-details strong{
    color:#0f172a;
}

</style>
</head>
<body>

<div class="success-card">

<div class="success-icon">🎉</div>

<h1>Order Successful!</h1>

<p id="thank-you-message">
Thank you for shopping with KYVORA.
</p>

<div class="order-id" id="order-id">
Order ID: Loading...
</div>

<div class="order-details">

<p><strong>Customer:</strong>
<span id="customer-name"></span></p>

<p><strong>Payment:</strong>
<span id="payment-method"></span></p>

<p><strong>Delivery Address:</strong>
<span id="delivery-address"></span></p>

<p><strong>Order Total:</strong>
$<span id="order-total"></span></p>

<p><strong>Estimated Delivery:</strong>
2–5 Business Days</p>

</div>

<a href="shop.html" class="shop-btn">
Continue Shopping
</a>

</div>

<script src="js/success.js"></script>

</body>
</html>
